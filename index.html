<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Interview Flashcards</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f6f2;
      --surface: #fff;
      --ink: #202923;
      --muted: #657168;
      --line: #d9dfd8;
      --green: #286349;
      --green-soft: #e4eee7;
      --coral: #b74d3d;
      --shadow: 0 12px 36px rgb(32 41 35 / 7%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    .page {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font: 600 30px/1.15 Georgia, "Times New Roman", serif;
      letter-spacing: 0;
    }

    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }

    .overall-count {
      flex: none;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(190px, 0.8fr);
      gap: 12px;
      padding: 22px 0 18px;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .toggle {
      display: inline-flex;
      grid-column: 1 / -1;
      align-items: center;
      gap: 8px;
      justify-self: start;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }

    .toggle input {
      width: 18px;
      min-height: 18px;
      height: 18px;
      margin: 0;
      padding: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    input:focus, select:focus, button:focus-visible {
      outline: 3px solid rgb(40 99 73 / 25%);
      outline-offset: 2px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      background: #e2e6e0;
      border-radius: 10px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--green);
      transition: width 180ms ease;
    }

    .card {
      display: flex;
      min-height: 310px;
      flex-direction: column;
      justify-content: space-between;
      margin-top: 20px;
      padding: clamp(22px, 6vw, 42px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .topic {
      padding: 4px 9px;
      color: var(--green);
      background: var(--green-soft);
      border-radius: 3px;
      font-size: 12px;
      font-weight: 650;
    }

    .card h2 {
      max-width: 650px;
      margin: 30px 0 24px;
      font: 500 clamp(21px, 3.6vw, 27px)/1.35 Georgia, "Times New Roman", serif;
      letter-spacing: 0;
    }

    .answer {
      margin: -8px 0 28px;
      padding: 16px 20px 16px 38px;
      background: #f5f6f2;
      border-left: 3px solid var(--green);
      color: #354139;
    }

    .answer li + li { margin-top: 6px; }

    code {
      padding: 1px 5px;
      background: #e8ebe6;
      border-radius: 3px;
      font: 0.88em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .card h2 code { font-size: 0.72em; }

    .answer[hidden] { display: none; }

    .card-actions, .navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .navigation { margin-top: 16px; }

    .button-group { display: flex; gap: 8px; }

    button {
      min-height: 42px;
      padding: 8px 13px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { border-color: #9eaaa0; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .language-switch {
      display: inline-flex;
      padding: 3px;
      background: #e8ebe6;
      border-radius: 5px;
    }

    .language-switch button {
      min-height: 34px;
      padding: 4px 9px;
      background: transparent;
      border-color: transparent;
      font-size: 13px;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--surface);
      border-color: var(--line);
      box-shadow: 0 1px 2px rgb(32 41 35 / 8%);
    }

    .primary {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .primary:hover:not(:disabled) { background: #204f3a; border-color: #204f3a; }

    .known {
      color: var(--green);
      background: var(--green-soft);
      border-color: #bed2c3;
    }

    .empty {
      margin-top: 20px;
      padding: 42px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: center;
    }

    .keyboard-hint {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .page { padding-top: 26px; }
      header { align-items: start; }
      h1 { font-size: 27px; }
      .controls { grid-template-columns: 1fr; gap: 9px; }
      .card { min-height: 300px; }
      .card-actions, .navigation { align-items: stretch; }
      .card-actions button, .navigation button { flex: 1; }
      .button-group { flex: 1; }
      .button-group button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1 id="app-title">Interview flashcards</h1>
        <p class="subtitle" id="app-subtitle">Senior Full-stack Engineer · backend focus</p>
      </div>
      <div class="header-tools">
        <div class="language-switch" role="group" aria-label="Language">
          <button id="language-en" type="button" aria-pressed="true">EN</button>
          <button id="language-pl" type="button" aria-pressed="false">PL</button>
        </div>
        <div class="overall-count" id="overall-count" aria-live="polite"></div>
      </div>
    </header>

    <section class="controls" aria-label="Find flashcards">
      <input id="search" type="search" placeholder="Search questions" aria-label="Search questions">
      <select id="topic-filter" aria-label="Filter by topic">
        <option value="">All topics</option>
      </select>
      <label class="toggle">
        <input id="hide-known" type="checkbox">
        <span id="hide-known-label">Hide known cards</span>
      </label>
    </section>

    <section aria-label="Flashcard progress">
      <div class="progress-row">
        <span id="deck-count"></span>
        <span id="known-count"></span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Known cards" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <section id="card-area" aria-live="polite"></section>
    <p class="keyboard-hint">Space: show answer · Left / right arrows: change card</p>
  </main>

  <script src="questions.js"></script>
  <script>
    const labels = {
      en: {
        title: 'Interview flashcards', subtitle: 'Senior Full-stack Engineer · backend focus', language: 'Language',
        search: 'Search questions', allTopics: 'All topics', progress: 'Known cards',
        known: 'known', knownInDeck: (count) => `${count} known in this deck`,
        card: (index, total) => `Card ${index} of ${total}`, noCards: 'No matching cards',
        empty: 'No cards match. Try another search or topic.', allKnown: 'All cards here are marked known. Untick “Hide known cards” to review them.',
        hideKnown: 'Hide known cards', show: 'Show answer', hide: 'Hide answer',
        marked: 'Known', notMarked: 'Not marked known', mark: 'Mark known',
        previous: 'Previous', next: 'Next', shuffle: 'Shuffle', navigation: 'Card navigation',
        keyboard: 'Space: show answer · Left / right arrows: change card'
      },
      pl: {
        title: 'Fiszki rekrutacyjne', subtitle: 'Starszy inżynier full-stack · backend', language: 'Język',
        search: 'Szukaj pytań', allTopics: 'Wszystkie tematy', progress: 'Znane fiszki',
        known: 'znanych', knownInDeck: (count) => `Znane w tym zestawie: ${count}`,
        card: (index, total) => `Karta ${index} z ${total}`, noCards: 'Brak pasujących fiszek',
        empty: 'Brak pasujących fiszek. Zmień wyszukiwanie lub temat.', allKnown: 'Wszystkie fiszki tutaj są oznaczone jako znane. Odznacz „Ukryj znane fiszki”, aby je powtórzyć.',
        hideKnown: 'Ukryj znane fiszki', show: 'Pokaż odpowiedź', hide: 'Ukryj odpowiedź',
        marked: 'Znam', notMarked: 'Do powtórki', mark: 'Znam',
        previous: 'Poprzednia', next: 'Następna', shuffle: 'Losuj', navigation: 'Nawigacja fiszek',
        keyboard: 'Spacja: pokaż odpowiedź · Strzałki w lewo/prawo: zmień fiszkę'
      }
    };

    const topicLabels = Object.fromEntries(TOPICS.map((topic) => [topic.id, topic]));
    const cardIds = new Set(FLASHCARDS.map((card) => card.id));

    const knownKey = 'interview-flashcards-known-v1';
    const languageKey = 'interview-flashcards-language-v1';
    const hideKnownKey = 'interview-flashcards-hide-known-v1';
    let language = 'en';
    try {
      language = localStorage.getItem(languageKey) === 'pl' ? 'pl' : 'en';
    } catch {
      language = 'en';
    }
    let hideKnown = false;
    try {
      hideKnown = localStorage.getItem(hideKnownKey) === 'true';
    } catch {
      hideKnown = false;
    }
    let known = new Set();
    try {
      known = new Set(JSON.parse(localStorage.getItem(knownKey) || '[]').filter((id) => cardIds.has(id)));
    } catch {
      known = new Set();
    }

    let orderedQuestions = [...FLASHCARDS];
    let currentIndex = 0;
    let answerVisible = false;

    const searchInput = document.querySelector('#search');
    const topicFilter = document.querySelector('#topic-filter');
    const hideKnownInput = document.querySelector('#hide-known');
    const hideKnownLabel = document.querySelector('#hide-known-label');
    const cardArea = document.querySelector('#card-area');
    const deckCount = document.querySelector('#deck-count');
    const knownCount = document.querySelector('#known-count');
    const overallCount = document.querySelector('#overall-count');
    const progressBar = document.querySelector('[role="progressbar"]');
    const progressFill = document.querySelector('#progress-fill');
    const languageEn = document.querySelector('#language-en');
    const languagePl = document.querySelector('#language-pl');
    const appTitle = document.querySelector('#app-title');
    const appSubtitle = document.querySelector('#app-subtitle');
    const keyboardHint = document.querySelector('.keyboard-hint');

    const usedTopics = new Set(FLASHCARDS.map((card) => card.topic));
    TOPICS.filter((topic) => usedTopics.has(topic.id)).forEach((topic) => {
      const option = document.createElement('option');
      option.value = topic.id;
      topicFilter.append(option);
    });

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    // Escapes the text, then turns `backtick` spans into <code>.
    function formatText(text) {
      return escapeHtml(text).replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function topicLabel(topicId) {
      return topicLabels[topicId]?.[language] ?? topicId;
    }

    // Cards matching search + topic; progress is measured against these.
    function getMatchingQuestions() {
      const query = searchInput.value.trim().toLowerCase();
      const topic = topicFilter.value;
      return orderedQuestions.filter((card) => {
        const matchesTopic = !topic || card.topic === topic;
        const searchableText = [card.en.q, ...card.en.a, card.pl.q, ...card.pl.a, card.topic].join(' ');
        const matchesQuery = !query || searchableText.toLowerCase().includes(query);
        return matchesTopic && matchesQuery;
      });
    }

    // Cards that can be shown: matching cards, minus known ones when they are hidden.
    function getFilteredQuestions() {
      const matching = getMatchingQuestions();
      return hideKnown ? matching.filter((card) => !known.has(card.id)) : matching;
    }

    function updateLanguage() {
      const copy = labels[language];
      document.documentElement.lang = language;
      document.title = copy.title;
      appTitle.textContent = copy.title;
      appSubtitle.textContent = copy.subtitle;
      document.querySelector('.language-switch').setAttribute('aria-label', copy.language);
      searchInput.placeholder = copy.search;
      searchInput.setAttribute('aria-label', copy.search);
      topicFilter.setAttribute('aria-label', copy.allTopics);
      progressBar.setAttribute('aria-label', copy.progress);
      keyboardHint.textContent = copy.keyboard;
      hideKnownLabel.textContent = copy.hideKnown;
      languageEn.setAttribute('aria-pressed', String(language === 'en'));
      languagePl.setAttribute('aria-pressed', String(language === 'pl'));
      for (const option of topicFilter.options) {
        option.textContent = option.value ? topicLabel(option.value) : copy.allTopics;
      }
      render();
    }

    function saveKnown() {
      try {
        localStorage.setItem(knownKey, JSON.stringify([...known]));
      } catch {
        // Progress still works for this page when storage is unavailable.
      }
    }

    function render() {
      const copy = labels[language];
      const matching = getMatchingQuestions();
      const filtered = hideKnown ? matching.filter((card) => !known.has(card.id)) : matching;
      const knownInDeck = matching.filter((card) => known.has(card.id)).length;
      const percentage = matching.length ? Math.round((knownInDeck / matching.length) * 100) : 0;
      overallCount.textContent = `${known.size} / ${FLASHCARDS.length} ${copy.known}`;
      deckCount.textContent = filtered.length ? copy.card(currentIndex + 1, filtered.length) : copy.noCards;
      knownCount.textContent = copy.knownInDeck(knownInDeck);
      progressFill.style.width = `${percentage}%`;
      progressBar.setAttribute('aria-valuenow', String(percentage));

      if (!filtered.length) {
        const allKnown = hideKnown && matching.length > 0;
        cardArea.innerHTML = `<div class="empty">${allKnown ? copy.allKnown : copy.empty}</div>`;
        return;
      }

      currentIndex = Math.min(currentIndex, filtered.length - 1);
      const card = filtered[currentIndex];
      const isKnown = known.has(card.id);
      const { q: question, a: points } = card[language];
      cardArea.innerHTML = `
        <article class="card">
          <div class="card-meta">
            <span class="topic">${escapeHtml(topicLabel(card.topic))}</span>
            <span>${isKnown ? copy.marked : copy.notMarked}</span>
          </div>
          <div>
            <h2 id="card-question">${formatText(question)}</h2>
            <ul class="answer" id="card-answer" ${answerVisible ? '' : 'hidden'}>
              ${points.map((point) => `<li>${formatText(point)}</li>`).join('')}
            </ul>
          </div>
          <div class="card-actions">
            <button class="primary" id="reveal-button" aria-expanded="${answerVisible}">${answerVisible ? copy.hide : copy.show}</button>
            <button class="${isKnown ? 'known' : ''}" id="known-button" aria-pressed="${isKnown}">${isKnown ? copy.marked : copy.mark}</button>
          </div>
        </article>
        <nav class="navigation" aria-label="${copy.navigation}">
          <div class="button-group">
            <button id="previous-button" aria-label="${copy.previous}">${copy.previous}</button>
            <button id="next-button" aria-label="${copy.next}">${copy.next}</button>
          </div>
          <button id="shuffle-button">${copy.shuffle}</button>
        </nav>`;

      document.querySelector('#reveal-button').addEventListener('click', () => {
        answerVisible = !answerVisible;
        render();
      });
      document.querySelector('#known-button').addEventListener('click', () => {
        if (isKnown) known.delete(card.id);
        else known.add(card.id);
        saveKnown();
        // With known cards hidden, the marked card disappears and the next one slides in.
        if (hideKnown && !isKnown) answerVisible = false;
        render();
      });
      document.querySelector('#previous-button').addEventListener('click', () => move(-1));
      document.querySelector('#next-button').addEventListener('click', () => move(1));
      document.querySelector('#shuffle-button').addEventListener('click', shuffle);
    }

    function move(direction) {
      const count = getFilteredQuestions().length;
      if (!count) return;
      currentIndex = (currentIndex + direction + count) % count;
      answerVisible = false;
      render();
    }

    function shuffle() {
      for (let index = orderedQuestions.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [orderedQuestions[index], orderedQuestions[swapIndex]] = [orderedQuestions[swapIndex], orderedQuestions[index]];
      }
      currentIndex = 0;
      answerVisible = false;
      render();
    }

    searchInput.addEventListener('input', () => { currentIndex = 0; answerVisible = false; render(); });
    topicFilter.addEventListener('change', () => { currentIndex = 0; answerVisible = false; render(); });
    hideKnownInput.checked = hideKnown;
    hideKnownInput.addEventListener('change', () => {
      hideKnown = hideKnownInput.checked;
      try {
        localStorage.setItem(hideKnownKey, String(hideKnown));
      } catch {
        // The toggle still works for this page when storage is unavailable.
      }
      currentIndex = 0;
      answerVisible = false;
      render();
    });
    languageEn.addEventListener('click', () => setLanguage('en'));
    languagePl.addEventListener('click', () => setLanguage('pl'));

    function setLanguage(nextLanguage) {
      language = nextLanguage;
      try {
        localStorage.setItem(languageKey, language);
      } catch {
        // The language switch still works for this page when storage is unavailable.
      }
      updateLanguage();
    }

    document.addEventListener('keydown', (event) => {
      const target = event.target;
      if (target instanceof HTMLInputElement || target instanceof HTMLSelectElement || target instanceof HTMLTextAreaElement) return;
      if (event.code === 'Space') {
        event.preventDefault();
        if (getFilteredQuestions().length) {
          answerVisible = !answerVisible;
          render();
        }
      } else if (event.key === 'ArrowLeft') {
        move(-1);
      } else if (event.key === 'ArrowRight') {
        move(1);
      }
    });

    updateLanguage();
  </script>
</body>
</html>
